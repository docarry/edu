<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Swiper demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1" />
    <!-- Link Swiper's CSS -->
    <link rel="stylesheet" href="./js/swiper-11.1.14/package/swiper-bundle.min.css">

    <!-- Demo styles -->
    <style>
        html,
        body {
            position: relative;

        }

        body {
            background: #eee;
            font-family: Helvetica Neue, Helvetica, Arial, sans-serif;
            font-size: 14px;
            color: #000;
            margin: 0;
            padding: 0;
        }

        .swiper {
            width: 100%;
        }
        .swiper-wrapper{
            width: 100%;
        }

        .swiper-slide {
            max-width: 1050px;
            max-height: 806px;
        }
        .swiper-slide.swiper-slide-active {
            max-width: 1050px !important;
            max-height: 806px !important;
            transform: translate3d(0, calc(100% - 94%), 0px) !important;
            opacity: 1;
        }
        .swiper-slide.swiper-slide-prev {
            max-width: 1180px !important;
            max-height: 920px !important;
            transform: translate3d(46%, 0px, 0px) !important;
            opacity: .2;
        }
        .swiper-slide.swiper-slide-next {
            max-width: 1180px !important;
            max-height: 920px !important;
            transform: translate3d(-46%, 0px, 0px) !important;
            opacity: .2;
        }

        .swiper-slide img {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 20px;
        }
    </style>
</head>

<body>
    <!-- Swiper -->
    <div class="swiper mySwiper">
        <div class="swiper-wrapper">
            <div class="swiper-slide">
                <img src="./img/artist/img01.jpg" />
            </div>
            <div class="swiper-slide">
                <img src="./img/artist/img02.jpg" />
            </div>
            <div class="swiper-slide">
                <img src="./img/artist/img03.jpg" />
            </div>
            <div class="swiper-slide">
                <img src="./img/artist/img04.jpg" />
            </div>
            <div class="swiper-slide">
                <img src="./img/artist/img05.jpg" />
            </div>
        </div>
        <div class="swiper-pagination"></div>
    </div>

    <!-- Swiper JS -->
    <script src="./js/swiper-11.1.14/package/swiper-bundle.min.js"></script>

    <!-- Initialize Swiper -->
    <script>
        var swiper = new Swiper(".mySwiper", {

            mousewheel: true,
            spaceBetween: 100,
            initialSlide: 2,
            effect: "coverflow",
            grabCursor: true,
            centeredSlides: true,
            slidesPerView: "auto",
            coverflowEffect: {
                rotate: 0,
                stretch: 0,
                depth: 0,
                modifier: 1,
                slideShadows: false,
            },
            pagination: {
                el: ".swiper-pagination",
            },
            loop: true,
            on: {

    },
    });

    </script>


</body>

</html>
